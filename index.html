<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Til helvete: e-scooter chaos in a rainy Oslo. Smash things, dodge trams, outrun the neighbourhood group.">
<style>[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
<title>Til helvete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=JetBrains+Mono:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&family=UnifrakturMaguntia&display=swap">
<style>
/* Layout: full-bleed 3D street on the canvas; HUD pinned to the corners; menu and newspaper are sheets laid over the city */
:root{
  --night:#0e1520; --panel:rgba(11,18,28,.80); --panel-solid:#101a27; --line:rgba(199,214,230,.20);
  --ink:#eef2f6; --muted:#a3b3c4; --coat:#f2c230; --coat-ink:#1d1606;
  --tram:#4a8be6; --boom:#ffe08a; --flag:#e0303f; --charge:#4fc3a6; --altinn:#a487ea; --mob:#ff8a3d; --fjord:#3c6e91;
  --paper:#f2eee4; --paper-ink:#1a1714; --paper-muted:#5d564d; --paper-rule:#1a1714;
  --f-display:"Anybody","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-news:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mast:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-display);-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--coat);outline-offset:3px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud-l{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;display:grid;gap:8px;width:min(236px,48vw);backdrop-filter:blur(6px)}
.dmg{display:grid;gap:0}
#dmg{font-family:var(--f-mono);font-weight:700;font-size:clamp(22px,5.4vw,34px);line-height:1.05;font-variant-numeric:tabular-nums;color:var(--coat);white-space:nowrap}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-stretch:85%}
.meter{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center}
.meter .bar{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.meter .bar i{display:block;height:100%;width:100%;background:var(--charge);border-radius:3px;transition:width .15s linear}
.meter.heat .bar i{background:var(--mob);width:0}
.meter b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.bombline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bombline b{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--muted)}
.bombline.ready b{color:var(--boom)}
#flash{position:fixed;inset:0;background:#fff7e0;opacity:0;pointer-events:none;z-index:7}
.pow{position:fixed;z-index:6;pointer-events:none;font-weight:900;font-stretch:70%;font-size:clamp(34px,8vw,64px);color:var(--coat);-webkit-text-stroke:2px #0e1520;paint-order:stroke fill;text-shadow:3px 4px 0 #0e1520;white-space:nowrap;transform:translate(-50%,-50%) rotate(var(--r));animation:powin .6s ease-out forwards}
@keyframes powin{0%{transform:translate(-50%,-50%) scale(.3) rotate(var(--r));opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(var(--r));opacity:1}100%{transform:translate(-50%,-85%) scale(1) rotate(var(--r));opacity:0}}
.speed{display:flex;align-items:baseline;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.speed b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:right}
.speed.fast b{color:var(--flag)}
.speed em{font-style:normal;margin-left:auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.hud-r{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:6px;justify-items:end}
#mini{width:min(160px,36vw);height:auto;aspect-ratio:330/262;border-radius:12px;border:1px solid var(--line);background:var(--panel-solid);display:block}
.wx{font-family:var(--f-mono);font-size:10px;color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:6px;max-width:min(180px,40vw);text-align:right;line-height:1.35}
#mute{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
#toasts{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;width:min(320px,40vw)}
.toast{font-family:var(--f-mono);font-size:13px;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:999px;white-space:nowrap;animation:pop .25s ease-out;display:flex;gap:7px;align-items:center}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coat);flex:none}
.toast.warn::before{background:var(--flag)}
.toast.ok::before{background:var(--charge)}
.toast.mob::before{background:var(--mob)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes pop{from{transform:translateY(-6px) scale(.94);opacity:0}to{transform:none;opacity:1}}
#status{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 36px);font-weight:800;font-stretch:80%;font-size:clamp(16px,3.4vw,22px);letter-spacing:.04em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);padding:8px 16px;border-radius:10px;white-space:nowrap}
#status.charge{color:var(--charge)}
#status.altinn{color:var(--altinn)}
#status.low{color:var(--flag)}
body.touch #status{bottom:calc(env(safe-area-inset-bottom,0px) + 170px);max-width:calc(100% - 32px);white-space:normal;text-align:center}
#bubble{position:fixed;z-index:4;pointer-events:none;background:var(--paper);color:var(--paper-ink);font-weight:700;font-size:14px;padding:6px 10px;border-radius:12px 12px 12px 2px;transform:translate(-10%,-100%);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#bigmsg{position:fixed;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bigmsg span{font-weight:900;font-stretch:60%;font-size:clamp(52px,15vw,150px);line-height:.88;text-transform:uppercase;color:var(--ink);text-shadow:0 6px 0 var(--flag),0 12px 40px rgba(0,0,0,.6);animation:slam .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}

/* ---------- touch pads ---------- */
#touch{position:fixed;inset:auto 0 0 0;z-index:5;pointer-events:none;height:0}
.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px;align-items:flex-end;pointer-events:auto;--arrow:clamp(54px,16vw,74px);--smb:clamp(46px,13vw,62px);--gasb:clamp(72px,21vw,96px)}
.pad.l{left:max(16px,env(safe-area-inset-left,0px))}
.pad.r{right:max(16px,env(safe-area-inset-right,0px))}
.pad.t{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 28px + clamp(54px,16vw,74px))}
.pad button{width:var(--arrow);height:var(--arrow);border-radius:50%;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
.pad button.sm{width:var(--smb);height:var(--smb);font-size:10px;letter-spacing:.05em}
.pad button.big{width:var(--gasb);height:var(--gasb);background:var(--coat);color:var(--coat-ink);font-size:15px;letter-spacing:.06em;border:0}
.pad.t button{width:auto;height:42px;border-radius:21px;padding:0 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.pad.t button.bomb{background:var(--boom);color:var(--coat-ink);border:0}
.pad.t button.bomb.cool{background:var(--panel);color:var(--boom);border:1px solid var(--boom)}
.pad button.on{transform:scale(.93);filter:brightness(1.25)}
.pad .col{display:flex;flex-direction:column;gap:10px}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:10;overflow-y:auto;display:grid;place-items:center;
  padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(14,21,32,.25),rgba(14,21,32,.65))}
.menu-card{width:100%;max-width:560px;box-sizing:border-box;background:rgba(10,16,26,.88);border:1px solid var(--line);border-radius:16px;padding:26px clamp(18px,5vw,32px) 22px;display:grid;gap:16px;backdrop-filter:blur(8px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;padding:5px 10px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
h1{margin:0;font-weight:900;font-stretch:150%;font-size:clamp(40px,10.5vw,76px);line-height:.86;letter-spacing:-.015em;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;display:inline-block;background:var(--coat);color:var(--coat-ink);padding:.04em .14em .02em;margin-top:.08em;transform:rotate(-2deg)}
.sub{margin:0;font-size:17px;line-height:1.45;color:var(--ink);max-width:46ch;font-stretch:95%}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.rules li{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.4;color:var(--muted)}
.rules li b{color:var(--ink);font-weight:750}
.sw{width:12px;height:12px;border-radius:3px;margin-top:4px;display:block}
.sw.dmg{background:var(--coat)}.sw.veh{background:var(--flag)}.sw.mob{background:var(--mob)}.sw.chg{background:var(--charge)}.sw.alt{background:var(--altinn)}.sw.fj{background:var(--fjord)}.sw.boom{background:var(--boom)}.sw.ped{background:var(--muted)}
.cta{background:var(--coat);color:var(--coat-ink);border:0;border-radius:10px;padding:14px 28px;font-weight:900;font-stretch:130%;font-size:22px;letter-spacing:.02em;text-transform:uppercase;justify-self:start}
.cta:hover{filter:brightness(1.08)}
.row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.best{margin:0;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.keys{margin:0;font-size:12px;line-height:2;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;margin:0 2px;color:var(--ink)}
.credit{margin:0;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
body.touch .keys{display:none}

/* ---------- newspaper ---------- */
.paper-wrap{width:100%;max-width:620px;display:grid;gap:14px}
.news{background:var(--paper);color:var(--paper-ink);padding:20px clamp(16px,4.5vw,28px) 22px;box-shadow:0 18px 50px rgba(0,0,0,.5);transform:rotate(-.8deg);animation:spinin .9s cubic-bezier(.15,.85,.3,1);display:grid;gap:12px;box-sizing:border-box}
@keyframes spinin{from{transform:scale(.05) rotate(-760deg);opacity:0}60%{opacity:1}to{transform:rotate(-.8deg)}}
.mast{font-family:var(--f-mast);font-size:clamp(38px,10vw,58px);text-align:center;line-height:1;margin:0}
.dateline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border-top:3px double var(--paper-rule);border-bottom:1px solid var(--paper-rule);padding:5px 0;color:var(--paper-muted)}
.eyebrow{margin:0;display:inline-block;justify-self:start;background:var(--flag);color:#fff;font-weight:900;font-stretch:120%;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px}
.news h2{margin:0;font-family:var(--f-news);font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1.04;text-wrap:balance}
.deck{margin:0;font-family:var(--f-news);font-style:italic;font-size:18px;line-height:1.35;color:var(--paper-muted)}
.news figure{margin:0;display:grid;gap:5px}
#snap{width:100%;aspect-ratio:16/9;max-width:100%;display:block;filter:grayscale(.85) contrast(1.15) sepia(.12);background:#888}
figcaption{font-family:var(--f-news);font-style:italic;font-size:12.5px;color:var(--paper-muted)}
.cols{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;border-top:1px solid var(--paper-rule);padding-top:12px}
.cols > div{min-width:0}
.nlbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted);display:block;margin-bottom:4px}
#pCost{font-family:var(--f-news);font-weight:700;font-size:clamp(28px,7vw,38px);line-height:1;font-variant-numeric:tabular-nums;display:block}
#pStats{font-family:var(--f-mono);font-size:12px;color:var(--paper-muted);display:block;margin-top:6px}
#pCould{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-family:var(--f-news);font-size:15.5px;line-height:1.3}
#pCould b{font-variant-numeric:tabular-nums}
.nbody{margin:0;font-family:var(--f-news);font-size:16px;line-height:1.5;border-top:1px solid var(--paper-rule);padding-top:10px;max-width:65ch}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em;text-transform:uppercase}
#copyOut{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--ink);background:var(--panel);padding:8px 10px;border-radius:8px;user-select:all;text-align:center}
@media (max-width:520px){.cols{grid-template-columns:1fr}.hud-l{padding:8px 10px 10px}.wx{display:none}}
@media (max-width:640px){#toasts{top:calc(env(safe-area-inset-top,0px) + 196px);width:calc(100% - 32px)}.toast{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.news{transform:none}}
</style>

</head>
<body>
<canvas id="c" tabindex="-1" aria-label="Oslo street, 3D game view"></canvas>

<div id="hud" hidden>
  <div class="hud-l">
    <div class="dmg"><span id="dmg">kr 0</span><span class="lbl" data-t="dmgLabel"></span></div>
    <div class="meter"><span class="lbl" data-t="battery"></span><b id="batTxt">100%</b><div class="bar"><i id="bat"></i></div></div>
    <div class="meter heat"><span class="lbl" data-t="heat"></span><b id="heatTxt">0</b><div class="bar"><i id="heat"></i></div></div>
    <div class="bombline" id="bombBox"><span class="lbl" data-t="bomb"></span><b id="bombTxt"></b></div>
    <div class="speed" id="spdBox"><b id="spd">0</b><span data-t="kmh"></span><em data-t="legal"></em></div>
  </div>
  <div class="hud-r">
    <canvas id="mini" width="330" height="262" aria-hidden="true"></canvas>
    <div class="wx" data-t="weather"></div>
    <button id="mute" type="button"></button>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="status" hidden></div>
</div>
<div id="bubble" hidden></div>
<div id="flash"></div>
<div id="bigmsg" hidden><span id="bigtxt"></span></div>

<div id="touch" hidden>
  <div class="pad t"><button data-k="horn" data-t="hornBtn"></button><button data-k="bomb" class="bomb" id="bombBtn" data-t="bombBtn"></button></div>
  <div class="pad l"><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button></div>
  <div class="pad r"><div class="col"><button data-k="boost" class="sm" data-t="boostBtn"></button><button data-k="brake" class="sm" data-t="brakeBtn"></button></div><button data-k="gas" class="big" data-t="gasBtn"></button></div>
</div>

<div id="menu" class="sheet">
  <div class="menu-card">
    <div class="top">
      <p class="kicker" data-t="kicker"></p>
      <div class="lang" role="group" aria-label="Language"><button id="lngNo" type="button">NO</button><button id="lngEn" type="button">EN</button></div>
    </div>
    <h1 id="h1"></h1>
    <p class="sub" data-t="sub"></p>
    <ul class="rules">
      <li><i class="sw dmg"></i><span data-th="r1"></span></li>
      <li><i class="sw veh"></i><span data-th="r2"></span></li>
      <li><i class="sw mob"></i><span data-th="r3"></span></li>
      <li><i class="sw chg"></i><span data-th="r4"></span></li>
      <li><i class="sw alt"></i><span data-th="r5"></span></li>
      <li><i class="sw boom"></i><span data-th="r7"></span></li>
      <li><i class="sw ped"></i><span data-th="r8"></span></li>
      <li><i class="sw fj"></i><span data-th="r6"></span></li>
    </ul>
    <div class="row"><button id="play" class="cta" type="button" data-t="play"></button><p class="best" id="best"></p></div>
    <p class="keys" data-th="keys"></p>
    <p class="credit" data-t="credit"></p>
  </div>
</div>

<div id="paper" class="sheet" hidden>
  <div class="paper-wrap">
    <article class="news" id="news">
      <p class="mast">Oslo Tidende</p>
      <div class="dateline"><span id="pDate"></span><span id="pNo"></span><span>Kr 49,–</span></div>
      <p class="eyebrow" data-t="breaking"></p>
      <h2 id="pHead"></h2>
      <p class="deck" id="pDeck"></p>
      <figure><canvas id="snap" width="640" height="360"></canvas><figcaption data-t="caption"></figcaption></figure>
      <div class="cols">
        <div><span class="nlbl" data-t="cost"></span><b id="pCost"></b><span id="pStats"></span></div>
        <div><span class="nlbl" data-t="could"></span><ul id="pCould"></ul></div>
      </div>
      <p class="nbody" id="pBody"></p>
    </article>
    <div class="actions">
      <button id="again" class="cta" type="button" data-t="again"></button>
      <button id="home" class="ghost" type="button" data-t="home"></button>
      <button id="copy" class="ghost" type="button" data-t="copy"></button>
    </div>
    <p id="copyOut" hidden></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);

/* ================= strings ================= */
const L = {
  no: {
    kicker: 'Oslo · oktober · ingen hjelm',
    sub: 'Lei en elsparkesykkel. Ingen førerkort, ingen hjelm, ingen konsekvenser. Bare rull.',
    r1: '<b>Knus ting.</b> Kafébord, bysykler, elbiler. Alt går på samfunnskostnaden.',
    r2: '<b>Trikk og buss betyr slutt.</b> Rødt lys på bakken betyr hold avstand.',
    r3: '<b>Nabolagsgruppa kommer.</b> Jo mer du knuser, jo flere naboer løper etter deg med mobilen fremme.',
    r4: '<b>Tomt batteri?</b> Stå stille i en grønn ladesone.',
    r5: '<b>Altinn lukker saken.</b> Stopp i en lilla sone og fyll ut skjemaet. Naboene mister interessen.',
    r6: '<b>Ikke kjør i fjorden.</b> Alle gjør det. Ikke vær alle.',
    r7: '<b>Tut og lydbombe.</b> Tut får naboene til å hoppe. Lydbomben kan du brøle så ofte du vil. Hvert 8. sekund er den full og velter alt og alle rundt deg.',
    r8: '<b>Folk på gaten.</b> Fotgjengere hopper unna. Treffer du en, reiser de seg sinte og blir med i Nabolagsgruppa.', p_ped: 'Legevaktregning',

    n.m.rotation.y = Math.atan2(-dx, -dz);
    if (d > 140) { n.x = n.x + dx * .5; n.z = n.z + dz * .5; }
    if (d < 1.15 && state === 'play') { die('caught'); return; }
  }
  // shouts
  shoutCd -= dt;
  if (shoutCd <= 0 && neighbors.length) {
    let near = null, nd = 45;
    for (const n of neighbors) { const d = Math.hypot(n.x - player.x, n.z - player.z); if (d < nd) { nd = d; near = n; } }
    if (near) { const si = Math.floor(Math.random() * L.no.shouts.length); bubbleTarget = near; bubbleT = 2.2; bubble.textContent = L[lang].shouts[si]; say(L.no.shouts[si], { pitch: rand(.6, 1.5) }); bubble.hidden = false; if (AC) tone(rand(180, 260), .18, 'square', .04, 0, rand(120, 160)); }
    shoutCd = rand(2.5, 4.5);
  }
  if (bubbleTarget) {
    bubbleT -= dt;
    _v.set(bubbleTarget.x, 2.3, bubbleTarget.z).project(camera);
    if (bubbleT <= 0 || _v.z > 1 || Math.abs(_v.x) > 1.1 || Math.abs(_v.y) > 1.1) hideBubble();
    else { bubble.style.left = ((_v.x * .5 + .5) * window.innerWidth) + 'px'; bubble.style.top = ((-_v.y * .5 + .5) * window.innerHeight) + 'px'; }
  }
}

/* ================= camera ================= */
const camPos = new THREE.Vector3(0, 6, 52), camLook = new THREE.Vector3(0, 1, 30);
function updateCamera(dt) {
  if (state === 'menu') {
    const a = clock * .045;
    camera.position.set(Math.cos(a) * 340, 95, Math.sin(a) * 300 - 100);
    camera.lookAt(0, 0, -100); camera.fov = 55; camera.updateProjectionMatrix(); return;
  }
  const fx = -Math.sin(player.a), fz = -Math.cos(player.a);
  const tPos = _v.set(player.x - fx * 9.5, 4.3 + (state === 'dying' ? 3 : 0), player.z - fz * 9.5);
  const k = 1 - Math.exp(-dt * (state === 'dying' ? 2 : 6));
  camPos.lerp(tPos, k);
  camLook.x += (player.x + fx * 4 - camLook.x) * k; camLook.y += (1 + player.y * .5 - camLook.y) * k; camLook.z += (player.z + fz * 4 - camLook.z) * k;
  camera.position.copy(camPos);
  if (shake > 0) { camera.position.x += rand(-1, 1) * shake; camera.position.y += rand(-1, 1) * shake * .6; shake = Math.max(0, shake - dt * 1.6); }
  camera.lookAt(camLook);
  const fov = 64 + clamp(Math.abs(player.v) - 12, 0, 9) * .9;
  if (Math.abs(camera.fov - fov) > .05) { camera.fov += (fov - camera.fov) * k; camera.updateProjectionMatrix(); }
}

/* ================= HUD ================= */
const bombBtn = $('bombBtn');
const els = { dmg: $('dmg'), bat: $('bat'), batTxt: $('batTxt'), heat: $('heat'), heatTxt: $('heatTxt'), spd: $('spd'), spdBox: $('spdBox'), bombTxt: $('bombTxt'), bombBox: $('bombBox') };
let hudLast = '';
function updateHUD() {
  const kmh = Math.round(Math.abs(player.v) * 3.6), bat = Math.round(player.bat), c = comments();
  const bs = Math.ceil(bombCd);
  const sig = damage + '|' + bat + '|' + Math.round(heat) + '|' + kmh + '|' + bs;
  if (sig === hudLast) return; hudLast = sig;
  els.bombTxt.textContent = bs > 0 ? t('bombWait', { s: bs }) : t('bombReady') + (coarse ? '' : ' · B'); els.bombBox.classList.toggle('ready', bs <= 0); if (bombBtn) bombBtn.classList.toggle('cool', bs > 0);
  els.dmg.textContent = kr(damage);
  els.bat.style.width = bat + '%'; els.bat.style.background = bat < 20 ? 'var(--flag)' : '';
  els.batTxt.textContent = bat + '%';
  els.heat.style.width = heat + '%'; els.heatTxt.textContent = t('comments', { n: fmtN(c) });
  els.spd.textContent = kmh; els.spdBox.classList.toggle('fast', kmh > 20);
}

/* ================= death + newspaper ================= */
function die(reason) {
  if (state !== 'play') return;
  state = 'dying'; deathT = 0; deathReason = reason;
  for (const k in keys) keys[k] = 0;
  setStatus(''); hideBubble();
  ({ tram: SFX.crash, bus: SFX.crash, caught: SFX.caught, fjord: SFX.splash })[reason]();
  say(SAY[reason + '_end'], { force: true, pitch: 1, rate: 1 });
  if (reason === 'fjord') player.knock = { x: -Math.sin(player.a) * 4, y: 3, z: -Math.cos(player.a) * 4 };
  if (reason === 'caught') {
    player.knock = null; punchCd = .25; beatSaid = 0;
    for (let k = neighbors.length; k < 5; k++) { const a = rand(0, PI * 2), r = rand(5, 9); makeNeighbor(player.x + Math.cos(a) * r, player.z + Math.sin(a) * r); }
    for (const n of neighbors) { n.stun = 0; n.m.rotation.x = 0; }
    say(SAY.beat, { force: true, pitch: 1.2, rate: 1.2 });
  }
  shake = reason === 'caught' ? .3 : .8;
  $('bigtxt').textContent = t('big_' + reason); $('bigmsg').hidden = reason === 'caught';
  if (navigator.vibrate) try { navigator.vibrate([60, 40, 120]); } catch (e) {}
}
function updateDying(dt) {
  deathT += dt;
  const k = player.knock;
  if (k) {
    k.y -= 20 * dt; player.x += k.x * dt; player.z += k.z * dt; player.y += k.y * dt;
    const floor = deathReason === 'fjord' && player.z > QUAY ? -3 : 0;
    if (player.y < floor) { player.y = floor; k.x *= .5; k.z *= .5; k.y = deathReason === 'fjord' ? 0 : -k.y * .25; }
    player.spin += dt * (deathReason === 'fjord' ? 2 : 7);
  }
  if (deathReason === 'caught') {
    const cnt = neighbors.length;
    neighbors.forEach((n, i) => {
      const a = i / cnt * PI * 2 + .4, tx = player.x + Math.cos(a) * 1.3, tz = player.z + Math.sin(a) * 1.3;
      const k = Math.min(1, dt * 5); n.x += (tx - n.x) * k; n.z += (tz - n.z) * k;
      n.t += dt * 15;
      const dx = player.x - n.x, dz = player.z - n.z, dd = Math.hypot(dx, dz) || 1;
      const lunge = Math.max(0, Math.sin(n.t + i * 1.9));
      n.m.position.set(n.x + dx / dd * lunge * .35, Math.abs(Math.sin(n.t * .5)) * .1, n.z + dz / dd * lunge * .35);
      n.m.rotation.set(-lunge * .5, Math.atan2(-dx, -dz), 0);
    });
    punchCd -= dt;
    if (punchCd <= 0 && deathT < 3.1) { SFX.punch(); pow(); shake = Math.max(shake, .28); punchCd = rand(.13, .3); if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {} }
    if (deathT > 1.1 && beatSaid < 1) { beatSaid = 1; say(SAY.ouch, { force: true, pitch: 1.4, rate: 1.3 }); }
    if (deathT > 2.5 && $('bigmsg').hidden) $('bigmsg').hidden = false;
  }
  if (deathT > (deathReason === 'caught' ? 3.9 : 1.6) && state === 'dying') showPaper();
}
function showPaper() {
  state = 'paper';
  $('bigmsg').hidden = true;
  renderer.render(scene, camera);
  const src = renderer.domElement, sc = $('snap'), g = sc.getContext('2d');
  const sw = Math.min(src.width, src.height * 16 / 9), sh = sw * 9 / 16;
  try { g.drawImage(src, (src.width - sw) / 2, (src.height - sh) / 2, sw, sh, 0, 0, sc.width, sc.height); } catch (e) {}
  if (damage > best) { best = damage; try { localStorage.setItem('fem-best', String(best)); } catch (e) {} }
  fillPaper();
  $('hud').hidden = true; $('touch').hidden = true; $('copyOut').hidden = true;
  $('paper').hidden = false; $('paper').scrollTop = 0;
  const n = $('news'); n.style.animation = 'none'; void n.offsetWidth; n.style.animation = '';
  setTimeout(() => $('again').focus({ preventScroll: true }), 300);
}
function fillPaper() {
  const now = new Date();
  $('pDate').textContent = new Intl.DateTimeFormat(lang === 'no' ? 'nb-NO' : 'en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
  const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5);
  $('pNo').textContent = t('issue', { n: doy });
  $('pHead').textContent = t('h_' + deathReason);
  $('pDeck').textContent = t('d_' + deathReason, { c: fmtN(Math.max(comments(), 37)) });
  $('pCost').textContent = kr(damage);
  $('pStats').textContent = t('stats', { n: smashed, t: fmtTime(playT) });
  const items = [['c_pils', 110], ['c_brunost', 120], ['c_hybel', 9500], ['c_bom', 45]];
  $('pCould').innerHTML = items.map(([k, price]) => '<li>' + t(k, { n: fmtN(Math.floor(damage / price)) }) + '</li>').join('');
  $('pBody').textContent = t('body', { kr: kr(damage), n: smashed, t: fmtTime(playT) });
}

/* ================= flow ================= */
function start() {
  initAudio(); setMute(muted);
  resetGame();
  state = 'play';
  $('menu').hidden = true; $('paper').hidden = true; $('bigmsg').hidden = true;
  $('hud').hidden = false; $('touch').hidden = !coarse;
  hudLast = ''; updateHUD();
  say(SAY.start, { force: true, pitch: 1.1 });
  $('c').focus({ preventScroll: true });
}
function toMenu() {
  state = 'menu'; resetGame();
  $('paper').hidden = true; $('hud').hidden = true; $('touch').hidden = true; $('menu').hidden = false;
  renderBest(); $('play').focus({ preventScroll: true });
}
$('play').addEventListener('click', start);
$('again').addEventListener('click', start);
$('home').addEventListener('click', toMenu);
$('mute').addEventListener('click', () => { initAudio(); setMute(!muted); });
$('copy').addEventListener('click', () => {
  const txt = t('share', { kr: kr(damage) });
  const out = $('copyOut');
  const fallback = () => { out.textContent = txt; out.hidden = false; const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try {
    navigator.clipboard.writeText(txt).then(() => { $('copy').textContent = t('copied'); setTimeout(() => $('copy').textContent = t('copy'), 1600); }, fallback);
  } catch (e) { fallback(); }
});
function renderBest() { $('best').textContent = best > 0 ? t('best', { v: kr(best) }) : ''; }
function applyLang() {
  document.documentElement.lang = lang === 'no' ? 'nb' : 'en';
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-th]').forEach(el => el.innerHTML = t(el.dataset.th));
  $('h1').innerHTML = 'Til <em>helvete</em>';
  $('lngNo').setAttribute('aria-pressed', String(lang === 'no')); $('lngEn').setAttribute('aria-pressed', String(lang === 'en'));
  $('mute').textContent = muted ? t('soundOff') : t('soundOn');
  renderBest(); hudLast = '';
  if (state === 'paper') fillPaper();
}
function setLang(l) { lang = l; try { localStorage.setItem('fem-lang', l); } catch (e) {} applyLang(); relabelZones(); }
$('lngNo').addEventListener('click', () => setLang('no'));
$('lngEn').addEventListener('click', () => setLang('en'));
applyLang();

/* ================= loop ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  updateVehicles(dt); updateFlying(dt);
  bellCd -= dt; wallCd -= dt; sayCd -= dt; hornCd -= dt; if (state === 'play') bombCd = Math.max(0, bombCd - dt);
  updateWave(dt); updatePeds(dt); cull(dt);
  if (state === 'play') {
    playT += dt;
    updatePlayer(dt);
    if (state === 'play') updateNeighbors(dt);
    if (playT - lastSmash > 5) heat = Math.max(0, heat - 1.3 * dt);
    updateHUD(); drawMini();
  } else if (state === 'dying') updateDying(dt);
  playerG.position.set(player.x, player.y, player.z);
  playerG.rotation.y = player.a;
  riderM.rotation.z = -player.steer * .28 * clamp(Math.abs(player.v) / 8, 0, 1);
  riderM.rotation.x = player.v > 15 ? -.12 : 0;
  if (state === 'dying' && player.knock) { playerG.rotation.x = player.spin; }
  else playerG.rotation.x = 0;
  playerG.rotation.z = state === 'dying' && deathReason === 'caught' ? Math.min(1, deathT * 1.6) * PI / 2 * .92 : 0;
  playerG.visible = state !== 'menu';
  if (humGain && AC) {
    const on = state === 'play' ? .025 + Math.abs(player.v) / 21 * .06 : 0;
    humGain.gain.setTargetAtTime(on, AC.currentTime, .08);
    hum.frequency.setTargetAtTime(55 + Math.abs(player.v) * 9, AC.currentTime, .1);
  }
  for (const q of zones) if (q.ring) q.ring.material.opacity = .55 + Math.sin(clock * 3) * .35;
  updateCamera(dt); updateRain(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(() => {
  buildCity();
  updateVehicles(0);
  requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
});
})();
</script>
